name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout BASIC submodule (HTTPS rewrite)
        run: |
          git submodule sync --recursive
          git -c protocol.file.allow=always submodule update --init --recursive

      - name: Install cc65 (ca65/ld65)
        run: sudo apt-get update && sudo apt-get install -y cc65

      - name: Build OS ROM
        working-directory: rom/os
        run: make

      - name: Verify ROM image produced
        working-directory: rom/os
        run: test -f build/os.bin && echo "OK: $(stat -c%s build/os.bin) bytes"
