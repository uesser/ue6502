name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repo including the BASIC submodule.
      #
      # Both ue6502 and ue6502-basic are PRIVATE, so submodule checkout needs
      # a token that can read both. The default GITHUB_TOKEN can only read the
      # current repo, so we fall back to a project secret (BASIC_READ_TOKEN, a
      # fine-grained PAT with read access to ue6502-basic) when present.
      #
      # To enable private-submodule CI, create a PAT that can read
      # uesser/ue6502-basic and store it as the repository secret
      # BASIC_READ_TOKEN in ue6502.
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BASIC_READ_TOKEN || github.token }}

      - name: Install cc65 (ca65/ld65)
        run: sudo apt-get update && sudo apt-get install -y cc65

      - name: Build OS ROM
        working-directory: rom/os
        run: make

      - name: Verify ROM image produced
        working-directory: rom/os
        run: |
          test -f build/os.bin
          echo "ROM image build/os.bin produced: $(stat -c%s build/os.bin) bytes"
