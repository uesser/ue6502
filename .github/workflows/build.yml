name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repo including the BASIC submodule. Native submodule
      # handling uses GITHUB_TOKEN over HTTPS (both ue6502 and ue6502-basic are
      # public), avoiding the SSH URL in .gitmodules.
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install cc65 (ca65/ld65)
        run: sudo apt-get update && sudo apt-get install -y cc65

      - name: Build OS ROM
        working-directory: rom/os
        run: make

      - name: Verify ROM image produced
        working-directory: rom/os
        run: |
          test -f build/os.bin
          echo "ROM image build/os.bin produced: $(stat -c%s build/os.bin) bytes"
