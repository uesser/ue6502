name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The BASIC submodule URL in .gitmodules is SSH (git@github.com:...),
      # which CI cannot clone without an SSH key. Rewrite github.com SSH URLs
      # to HTTPS (works for public repos) before syncing submodules.
      - name: Checkout BASIC submodule (HTTPS rewrite)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install cc65 (ca65/ld65)
        run: sudo apt-get update && sudo apt-get install -y cc65

      - name: Build OS ROM
        working-directory: rom/os
        run: make

      - name: Verify ROM image produced
        working-directory: rom/os
        run: |
          test -f build/os.bin
          echo "ROM image build/os.bin produced: $(stat -c%s build/os.bin) bytes"
